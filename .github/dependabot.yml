version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      core-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "typescript"
      threejs-ecosystem:
        patterns:
          - "three"
          - "@react-three/*"
          - "@types/three"
    open-pull-requests-limit: 5
